# Generates CastHop.xcodeproj: run `xcodegen` here. The project is not committed.
# Signing is left to local configuration: choose a team in Xcode, or pass DEVELOPMENT_TEAM to xcodebuild.
name: CastHop
options:
  bundleIdPrefix: io.github.ozkanceng.casthop
  developmentLanguage: en
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    SWIFT_EMIT_LOC_STRINGS: true
    STRING_CATALOG_GENERATE_SYMBOLS: false
packages:
  CastHopKit:
    path: CastHopKit
targets:
  ReceiverApp:
    type: application
    supportedDestinations: [iOS, tvOS, macOS]
    sources:
      - path: Receiver
        excludes:
          - Info.plist
    dependencies:
      - package: CastHopKit
        product: CastHopReceiver
    settings:
      base:
        PRODUCT_NAME: CastHopReceiver
        PRODUCT_MODULE_NAME: CastHopReceiverApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozkanceng.casthop.receiver
        INFOPLIST_FILE: Receiver/Info.plist
        TARGETED_DEVICE_FAMILY: "2,3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": TVIcon
        SUPPORTS_MACCATALYST: false
        ENABLE_HARDENED_RUNTIME: true
  SenderApp:
    type: application
    platform: iOS
    sources:
      - path: Sender
        excludes:
          - Info.plist
          - Sender.entitlements
    dependencies:
      - package: CastHopKit
        product: CastHopSender
      - target: BroadcastExtension
    settings:
      base:
        PRODUCT_NAME: CastHop
        PRODUCT_MODULE_NAME: CastHopSenderApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozkanceng.casthop.sender
        INFOPLIST_FILE: Sender/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sender/Sender.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes:
          - Info.plist
          - Broadcast.entitlements
      - path: Sender/FailureText.swift
      - path: Sender/Localizable.xcstrings
    dependencies:
      - package: CastHopKit
        product: CastHopSender
      - sdk: ReplayKit.framework
    settings:
      base:
        PRODUCT_NAME: CastHopBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ozkanceng.casthop.sender.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Broadcast/Broadcast.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: true
        # Every megabyte counts inside the extension's limit.
        DEAD_CODE_STRIPPING: true
        SWIFT_OPTIMIZATION_LEVEL: -O
  casthop-receiver:
    type: tool
    platform: macOS
    sources:
      - path: CastHopKit/Sources/casthop-receiver
    dependencies:
      - package: CastHopKit
        product: CastHopReceiver
    settings:
      base:
        PRODUCT_NAME: casthop-receiver
  casthop-sender:
    type: tool
    platform: macOS
    sources:
      - path: CastHopKit/Sources/casthop-sender
    dependencies:
      - package: CastHopKit
        product: CastHopSender
    settings:
      base:
        PRODUCT_NAME: casthop-sender
