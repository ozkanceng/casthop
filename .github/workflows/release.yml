name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Yayın, uçtan uca testler geçmeden yapılmaz.
  integration:
    uses: ./.github/workflows/integration.yml

  android:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YANSIT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::YANSIT_KEYSTORE_BASE64 secret is not set; see docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "YANSIT_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          YANSIT_KEYSTORE_PASSWORD: ${{ secrets.YANSIT_KEYSTORE_PASSWORD }}
          YANSIT_KEY_ALIAS: ${{ secrets.YANSIT_KEY_ALIAS }}
          YANSIT_KEY_PASSWORD: ${{ secrets.YANSIT_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --stacktrace lint test assembleRelease -PyansitVersionName="$VERSION"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/yansit-$VERSION.apk"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-android
          path: dist/

  receiver:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: debian:12
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: receiver/ci/install-deps.sh

      - name: Build and test
        run: receiver/ci/build-and-test.sh receiver/build-release

      - name: Build .deb
        run: receiver/ci/build-deb.sh dist

      - name: Build portable package
        run: receiver/ci/build-portable.sh dist "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-receiver
          path: dist/

  # Taşınabilir paket, geliştirme paketleri olmayan temiz bir Debian 12'de açılabilmeli.
  portable-test:
    needs: receiver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: debian:12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-receiver
          path: dist
      - name: Test on a clean system
        run: receiver/ci/test-portable.sh dist/yansit-receiver-*.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [android, receiver, portable-test]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
