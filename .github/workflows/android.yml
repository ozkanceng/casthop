name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "protocol/**", "tools/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "protocol/**", "tools/**", ".github/workflows/android.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew --stacktrace lint

      - name: Unit tests
        run: ./gradlew --stacktrace test

      - name: Build APKs (debug + unsigned release)
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
