name: Soak

# Uzun süre testi (PLAN M7): her gece ve elle. 30 dk görüntü + ses; gecikme eğimi, RSS artışı, kayıp.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Süre (dakika)"
        default: "30"

permissions:
  contents: read

jobs:
  fake-sender:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :fake-sender:installDist
      - uses: actions/upload-artifact@v7
        with:
          name: fake-sender-soak
          path: tools/fake-sender/build/install/fake-sender
          retention-days: 3

  soak:
    needs: fake-sender
    runs-on: ubuntu-latest
    timeout-minutes: 70
    container: debian:12
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          receiver/ci/install-deps.sh
          tools/integration/install-deps.sh
      - name: Build receiver (release)
        run: |
          cmake -S receiver -B receiver/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYANSIT_BUILD_TESTS=OFF
          cmake --build receiver/build
      - uses: actions/download-artifact@v8
        with:
          name: fake-sender-soak
          path: fake-sender
      - name: Soak
        run: |
          chmod +x fake-sender/bin/fake-sender
          tools/soak/run.sh receiver/build/src/casthop fake-sender/bin/fake-sender \
            "${{ github.event.inputs.minutes || '30' }}" soak-work
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: soak-results
          path: |
            soak-work/summary.json
            soak-work/soak.svg
            soak-work/*.csv
            soak-work/*.log
          retention-days: 30
